"$schema" = 'https://starship.rs/config-schema.json'

# Minimal two-line prompt: directory + git only.
# Foreground colors, dim "·" separators, no background blocks.

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$line_break\
$character"""

palette = 'catppuccin_mocha'

add_newline = true

[username]
show_always = true
style_user = "teal"
style_root = "red"
format = '[$user]($style)'

[hostname]
ssh_only = false
style = "teal"
format = '[@$hostname]($style)[ · ](overlay0)'

[directory]
style = "bold blue"
format = "[$path]($style)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "mauve"
format = '[ · ](overlay0)[$symbol $branch]($style)'

[git_status]
style = "red"
format = '([ $all_status$ahead_behind]($style))'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[character]
success_symbol = '[❯](green)'
error_symbol = '[❯](red)'
vimcmd_symbol = '[❮](green)'
vimcmd_replace_one_symbol = '[❮](lavender)'
vimcmd_replace_symbol = '[❮](lavender)'
vimcmd_visual_symbol = '[❮](yellow)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
